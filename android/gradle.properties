org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true

# 한글 사용자명 (예: C:\Users\박규원) 경로를 Kotlin 컴파일러가 \u 이스케이프로
# 잘못 변환하는 문제 회피. UTF-8 인코딩 강제 + Kotlin 데몬 JVM args 동일 설정.
kotlin.daemon.jvmargs=-Xmx4G -Dfile.encoding=UTF-8

# Gradle 파일 인코딩
systemProp.file.encoding=UTF-8
