name: Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  FLUTTER_VERSION: '3.41.6'
  PROD_API_BASE_URL: 'https://apt-ev-charging.vercel.app'
  GOOGLE_WEB_CLIENT_ID: '838650325157-jeblq38cd6i2nln1vvjua8o0set46bo0.apps.googleusercontent.com'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  build-android:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      - run: flutter pub get
      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --dart-define=API_BASE_URL=${{ env.PROD_API_BASE_URL }} \
            --dart-define=GOOGLE_CLIENT_ID=${{ env.GOOGLE_WEB_CLIENT_ID }} \
            --dart-define=APP_ENV=prod
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  build-ios:
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      - run: flutter pub get
      - name: Build iOS (no codesign)
        run: |
          flutter build ios --no-codesign \
            --dart-define=API_BASE_URL=${{ env.PROD_API_BASE_URL }} \
            --dart-define=GOOGLE_CLIENT_ID=${{ env.GOOGLE_WEB_CLIENT_ID }} \
            --dart-define=APP_ENV=prod
