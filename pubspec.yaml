name: apt_ev_charging
description: APT EV Charging mobile app for iOS and Android
publish_to: 'none'

version: 1.1.7+25

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  # HTTP + 세션 쿠키 (백엔드 무수정 원칙)
  dio: ^5.7.0
  dio_cookie_manager: ^3.2.0
  cookie_jar: ^4.0.8

  # 보안 저장소 / 로컬 캐시
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # 인증
  google_sign_in: ^7.1.0

  # 상태관리 (화면 전환은 Navigator 사용)
  provider: ^6.1.5

  # 이미지 업로드
  image_picker: ^1.1.2
  google_mlkit_text_recognition: 0.15.1
  flutter_webrtc: 1.6.2+hotfix.4

  # 슬롯 QR 생성
  qr_flutter: ^4.1.0

  # 포맷
  intl: ^0.19.0

  # BLE 비콘 스캔 (관리자 콘솔)
  flutter_blue_plus: ^1.32.12
  permission_handler: ^11.3.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  sqflite: ^2.4.2
  google_maps_flutter: 2.18.1
  google_maps_flutter_ios_sdk9: ^2.19.0
  flutter_map: 8.3.2
  latlong2: 0.9.1
  url_launcher: 6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

  flutter_secure_storage_platform_interface: ^1.1.2
  shared_preferences_platform_interface: ^2.4.2
  sqflite_common_ffi: ^2.4.0
flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/docs/
