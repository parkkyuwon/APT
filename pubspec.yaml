name: apt_ev_charging
description: APT EV Charging mobile app for iOS and Android
publish_to: 'none'

version: 1.1.0+13

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # HTTP + 세션 쿠키 (백엔드 무수정 원칙)
  dio: ^5.7.0
  dio_cookie_manager: ^3.2.0
  cookie_jar: ^4.0.8

  # 보안 저장소 / 로컬 캐시
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # 인증
  google_sign_in: ^7.1.0

  # 라우팅 / 상태관리
  go_router: ^14.6.1
  provider: ^6.1.5

  # 이미지 / 미디어
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # 외부 링크 / PDF
  url_launcher: ^6.3.1

  # QR (관리자 qr / vehicle_verify)
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # 포맷
  intl: ^0.19.0

  # 로깅
  logger: ^2.4.0

  # BLE 비콘 스캔 (관리자 콘솔)
  flutter_blue_plus: ^1.32.12
  permission_handler: ^11.3.1

  # 폰트
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/docs/
