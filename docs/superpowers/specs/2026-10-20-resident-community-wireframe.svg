<style>text{font-family:'Malgun Gothic',sans-serif;fill:#17253c;font-size:16px}.title{font-size:24px;font-weight:bold}.head{font-size:19px;font-weight:bold}.small{font-size:13px;fill:#516078}.button{fill:white;font-weight:bold}.panel{fill:white;stroke:#c7d3e4}.field{fill:#f7f9fc;stroke:#c7d3e4}</style>
