<h1>주차장 도면 단순화 미리보기</h1>
<p>주차 블록과 통로는 또렷하게, 작은 도면 주석은 덜어내는 표현 시안입니다. 이미지를 클릭하면 전체 크기로 볼 수 있습니다.</p>
<p class="note">사용자의 후속 승인으로 이 도식화를 앱 지도에 적용했습니다. 원본 이미지는 보존합니다. AI 생성 도식이므로 실제 도면과 차이가 있을 수 있으며, 세부 구조와 마커 위치는 현장 대조가 필요합니다.</p>
